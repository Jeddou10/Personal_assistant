[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-desktop"
version = "0.1.0a1"
description = "A Windows desktop assistant with a floating soccer ball, scoped integrations, and explicit write approval."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Personal Assistant contributors"}]
keywords = ["desktop", "assistant", "tkinter", "anthropic", "ollama", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2.2", "ruff>=0.9.0", "twine>=6.1.0"]

[project.gui-scripts]
personal-assistant = "assistant_app.frontend.app:main"

[project.scripts]
personal-assistant-mcp = "assistant_app.mcp.__main__:main"

[project.urls]
Repository = "https://github.com/Jeddou10/Personal_assistant"
Issues = "https://github.com/Jeddou10/Personal_assistant/issues"
Documentation = "https://github.com/Jeddou10/Personal_assistant#readme"
Changelog = "https://github.com/Jeddou10/Personal_assistant/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["assistant_app*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".local-notes", ".venv", ".venv-check", "dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
