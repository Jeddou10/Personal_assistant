name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check publishable files
        run: python scripts/check_repository.py
      - name: Run tests with native windows hidden
        run: python scripts/run_tests.py --headless
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Inspect archive contents
        run: python scripts/check_dist.py
      - name: Smoke-test installed wheel outside the source tree
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl | Select-Object -First 1).FullName
          $smokeScript = (Resolve-Path scripts/smoke_installed.py).Path
          $wheelEnv = Join-Path $env:RUNNER_TEMP 'assistant-wheel-check'
          python -m venv $wheelEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelPython = Join-Path $wheelEnv 'Scripts/python.exe'
          & $wheelPython -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            & $wheelPython $smokeScript
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Upload packages for inspection (no publishing)
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: dist/*
          retention-days: 7
          if-no-files-found: error
