name: Bug report
description: Report a reproducible problem using non-sensitive data.
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, OAuth files, account content, or private screenshots. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fabricated data. Include minimal steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, Python version, project version/commit
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Anthropic
        - Local Ollama
        - Not relevant
  - type: textarea
    id: details
    attributes:
      label: Additional non-sensitive context
      description: Include sanitized error text only; never raw tokens or account data.
